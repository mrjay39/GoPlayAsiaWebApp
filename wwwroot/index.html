    <script type="module">
        import { BrotliDecode } from './decode.min.js';
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                if (type !== 'dotnetjs' && location.hostname !== 'localhost' && type !== 'configuration') {
                    return (async function () {
                        const response = await fetch(defaultUri + '.br', { cache: 'no-cache' });
                        if (!response.ok) {
                            throw new Error(response.statusText);
                        }
                        const originalResponseBuffer = await response.arrayBuffer();
                        const originalResponseArray = new Int8Array(originalResponseBuffer);
                        const decompressedResponseArray = BrotliDecode(originalResponseArray);
                        const contentType = type ===
                            'dotnetwasm' ? 'application/wasm' : 'application/octet-stream';
                        return new Response(decompressedResponseArray,
                            { headers: { 'content-type': contentType } });
                    })();
                }
            }
        });
    </script>
    <script>
        function checkForNewVersion() {
            fetch('_framework/blazor.boot.json', { cache: 'no-cache' })
                .then(response => {
                    if (!response.ok) {
                        console.error('Failed to fetch blazor.boot.json:', response.statusText);
                        return Promise.reject('Failed to fetch');
                    }
                    return response.json();
                })
                .then(bootManifest => {
                    const newVersion = bootManifest?.resources?.wasmNative?.['dotnet.native.wasm'] ?? 'no-version';

                    if (localStorage['blazor-version'] !== newVersion) {
                        localStorage['blazor-version'] = newVersion;

                        // Force reload with a unique query string to bypass cache
                        const currentUrl = window.location.href;
                        const newUrl = currentUrl.split('?')[0] + '?gpa=' + new Date().getTime();
                        window.location.href = newUrl;
                    }
                })
                .catch(error => {
                    console.error('Error checking for new version:', error);
                });

            //checkForNewStylesheetVersion(); // Call this function after checking Blazor version
        }

        function checkForNewStylesheetVersion() {
            fetch('GoPlayAsiaWebApp.styles.css?nc=CHECK_VERSION', { cache: 'no-cache' })
                .then(response => {
                    if (!response.ok) {
                        console.error('Failed to fetch stylesheet:', response.statusText);
                        return Promise.reject('Failed to fetch');
                    }
                    return response.text();
                })
                .then(cssContent => {
                    const currentHash = localStorage.getItem('stylesheet-hash');
                    const newHash = hashCode(cssContent);

                    if (currentHash !== newHash) {
                        localStorage.setItem('stylesheet-hash', newHash);

                        // Update the link to force reload
                        const link = document.getElementById('stylesheet');
                        link.href = link.href.split('?')[0] + '?nc=' + new Date().getTime();
                    }
                })
                .catch(error => {
                    console.error('Error checking for new stylesheet version:', error);
                });
        }

        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = (hash << 5) - hash + char;
                hash |= 0; // Convert to 32-bit integer
            }
            return hash;
        }

        //window.addEventListener('load', checkForNewVersion);
    </script>
